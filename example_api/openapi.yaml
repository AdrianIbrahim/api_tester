openapi: 3.0.3

info:
  title: Test API
  version: 1.0.0

servers:
  - url: http://localhost:8000

paths:
  /users:
    get:
      summary: Vrátí seznam uživatelů
      responses:
        "200":
          description: Seznam uživatelů
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required:
                    - id
                    - name
                  properties:
                    id:
                      type: integer
                    name:
                      type: string

  /users/{id}:
    get:
      summary: Vrátí konkrétního uživatele
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Uživatel nalezen
          content:
            application/json:
              schema:
                type: object
                required:
                  - id
                  - name
                properties:
                  id:
                    type: integer
                  name:
                    type: string
        "404":
          description: Uživatel nenalezen